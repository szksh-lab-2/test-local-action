name: nllint
description: nllint
inputs:
  is:
    default: "true"
    description: "Whether to run nllint"
runs:
  using: composite
  steps:
    # wi5oofoo2vai is a randowm string to avoid name conflicts
    - if: inputs.is == 'true'
      shell: bash
      run: |
        cp -R "$GITHUB_ACTION_PATH/nllint" nllint-wi5oofoo2vai
    - if: inputs.is == 'true'
      uses: ./nllint-wi5oofoo2vai
    - if: always()
      shell: bash
      run: |
        if [ -d "nllint-wi5oofoo2vai" ]; then
          rm -rf "nllint-wi5oofoo2vai"
        fi
